name: CI (güvenlik kontrolleri)

on:
  pull_request:
  push:
    branches: [main]

# En az yetki: bu iş akışı yalnızca kodu okur.
permissions:
  contents: read

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks tüm geçmişi tarar
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tehlikeli DOM yazma noktası yok (innerHTML, eval…)
        run: npm run check:dom
      - name: Bağımlılık taraması (yüksek ve kritik açık varsa dur)
        run: npm audit --audit-level=high --omit=dev
      - name: Derleme
        run: npm run build
      - name: Gizli anahtar taraması (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
