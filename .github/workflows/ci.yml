name: CI (güvenlik kontrolleri)

on:
  pull_request:
  push:
    branches: [main]

# En az yetki: bu iş akışı yalnızca kodu okur.
permissions:
  contents: read

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks tüm geçmişi tarar
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tehlikeli DOM yazma noktası yok (innerHTML, eval…)
        run: npm run check:dom
      - name: Bağımlılık taraması (yüksek ve kritik açık varsa dur)
        run: npm audit --audit-level=high --omit=dev
      - name: Derleme
        run: npm run build
      - name: Gizli anahtar taraması (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
