name: Yayına al (Cloudflare Pages)

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # her gün 06:17 (TR): günlük anlık görüntüyü yenile
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Günlük anlık görüntü (API kapalıysa uygulamanın açılacağı son veri)
        run: npm run snapshot
        continue-on-error: true # Binance yanıt vermezse yayın yine de yapılır
      - run: npm run build
      - name: Cloudflare Pages'e yükle
        uses: cloudflare/wrangler-action@v3
        with:
          # Token yalnızca "Cloudflare Pages: Edit" iznine sahip; GitHub Secrets'ta saklanır.
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # İlk çalıştırmada proje yoksa oluşturulur (varsa hata yok sayılır), sonra yüklenir.
          preCommands: npx wrangler pages project create kripto-piyasa-panosu --production-branch=main || true
          command: pages deploy dist --project-name=kripto-piyasa-panosu --branch=main --commit-dirty=true
